name: Android Emulator Remote Screen

on:
  workflow_dispatch:


jobs:

  android:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17


      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}


      - name: Check Tailscale
        run: |
          echo "Tailscale status:"
          tailscale status

          echo "Tailscale IP:"
          tailscale ip -4


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2

        with:

          api-level: 29

          target: default

          arch: x86

          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim

          disable-animations: true


          script: |
            echo "Waiting for emulator..."

            adb wait-for-device


            echo "Waiting for Android startup..."

            sleep 30


            echo "Android boot property:"

            adb shell getprop sys.boot_completed


            echo "Enable ADB TCP mode..."

            adb tcpip 5555


            sleep 5


            TAILSCALE_IP=$(tailscale ip -4)


            echo ""
            echo "================================="
            echo " CONNECT USING THIS ADDRESS:"
            echo ""
            echo "${TAILSCALE_IP}:5555"
            echo "================================="


            echo ""
            echo "Emulator running for 6 hours"


            sleep 21600
