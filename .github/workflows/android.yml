name: Android Emulator Remote Screen

on:
  workflow_dispatch:


jobs:

  android:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout Repository
        uses: actions/checkout@v5



      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17



      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-android-emulator



      - name: Verify Tailscale
        run: |

          sleep 5

          echo "Tailscale status:"
          sudo tailscale status

          echo "Tailscale IP:"
          sudo tailscale ip -4



      - name: Enable KVM
        run: |

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules

          sudo udevadm trigger --name-match=kvm



      - name: Start Android Emulator

        uses: reactivecircus/android-emulator-runner@v2


        with:

          api-level: 34

          target: google_apis

          arch: x86_64


          emulator-options: >

            -no-window

            -gpu swiftshader_indirect

            -noaudio

            -no-boot-anim

            -no-snapshot

            -no-snapshot-save

            -wipe-data


          disable-animations: true



          script: |


            echo "Restarting ADB..."

            adb kill-server

            adb start-server



            echo "Waiting for emulator device..."

            adb wait-for-device



            echo "Waiting for Android..."

            sleep 30



            echo "Checking device state..."


            adb devices



            echo "Reconnect offline devices..."

            adb reconnect



            sleep 10



            adb devices



            echo "Boot status:"

            adb shell getprop sys.boot_completed



            echo "Enable TCP ADB..."

            adb tcpip 5555



            sleep 5



            IP=$(sudo tailscale ip -4)



            echo ""

            echo "================================"

            echo "ADB CONNECTION ADDRESS"

            echo ""

            echo "${IP}:5555"

            echo ""

            echo "================================"



            echo ""

            echo "Keeping emulator alive"



            sleep 21600
