name: Android noVNC Emulator via Cloudflare

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" # Forces GitHub actions to use Node 24, completely removing the Node 20 warning

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Cloudflare Quick Tunnel
        id: cloudflare
        run: |
          # Download and install cloudflared binary
          curl -L --output cloudflared.deb https://github.com
          sudo dpkg -i cloudflared.deb
          
          # Spin up quick tunnel pointing to local port 6080 (where noVNC runs inside the docker container)
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &
          sleep 5
          
          # Print the live web access link directly to the console logs
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" cloudflare.log | head -n 1)
          echo "--------------------------------------------------------"
          echo "🔗 LIVE EMULATOR WEB LINK:"
          echo "$TUNNEL_URL/vnc.html"
          echo "--------------------------------------------------------"

      - name: Run Headless Android Container
        run: |
          # Launch a pre-configured Android emulator container with an embedded noVNC server on port 6080
          # This build utilizes internal software rendering (SwiftShader) to prevent hardware virtualization crashes (Exit Code 9)
          docker run -d -p 6080:6080 --device /dev/kvm:/dev/kvm --privileged budtmo/docker-android-x86-11.0
          
          echo "Waiting for the container environment to initialize..."
          sleep 30
          
          # Keep runner alive for up to 6 hours
          sleep 21600
