name: Headless Android Emulator Test

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test-headless-android:
    runs-on: macos-13 # Standard macOS runners have hardware acceleration pre-enabled out of the box
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Headless Background Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          # Crucial option strings used by CI systems to drop all visual rendering
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          
          # This is the ONLY thing a headless runner can do: execute text commands against ADB
          script: |
            echo "Checking if the emulator is visible over Android Debug Bridge..."
            adb devices
            
            echo "Fetching device system properties to verify it is alive:"
            adb shell getprop ro.build.version.release
            
            echo "The emulator is healthy. Executing background tasks completed successfully!"
