name: Headless Android Emulator Test

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-headless-android:
    runs-on: ubuntu-latest # Instantly launches on the unlimited Linux pool
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Headless Background Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25 # Low API level consumes almost no RAM
          target: default
          arch: x86 # x86 architecture matches native Linux platforms perfectly
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Checking background device connectivity..."
            adb devices
            
            echo "Device System Boot Status Output:"
            adb shell getprop ro.build.version.release
            
            echo "Headless emulator initialized and tested successfully!"
