name: Android noVNC Emulator via Cloudflare

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install noVNC and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y x11vnc xvfb fluxbox novnc python3-pip

      - name: Setup Cloudflare Quick Tunnel on Runner
        id: cloudflare
        run: |
          # Download and install cloudflared on the GitHub runner
          curl -L --output cloudflared.deb https://github.com
          sudo dpkg -i cloudflared.deb
          
          # Start a quick public tunnel pointing to noVNC's port 80
          cloudflared tunnel --url http://localhost:80 > cloudflare.log 2>&1 &
          sleep 5
          
          # Extract the temporary public URL generated by Cloudflare
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" cloudflare.log | head -n 1)
          echo "URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo "--------------------------------------------------------"
          echo "🔗 TEMPORARY EMULATOR LINK: $TUNNEL_URL/emulator/vnc.html"
          echo "--------------------------------------------------------"

      - name: Run Android Emulator & Start Stream
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: |
            # 1. Start virtual monitor
            Xvfb :1 -screen 0 1080x1920x24 &
            export DISPLAY=:1
            fluxbox &
            
            # 2. Convert to VNC (Port 5900)
            x11vnc -display :1 -nopw -forever -bg
            
            # 3. Create folder structure matching the web path
            sudo mkdir -p /usr/share/novnc/emulator
            sudo cp -r /usr/share/novnc/* /usr/share/novnc/emulator/ 2>/dev/null || true
            
            # 4. Start noVNC web stream (Port 80)
            /usr/share/novnc/utils/launch.sh --vnc localhost:5900 --listen 80 &
            
            echo "🚀 Android Booted. Use the link provided in the Setup Cloudflare step!"
            sleep 21600
