name: Android noVNC Emulator via Cloudflare

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # THIS IS THE CRITICAL KVM FIX STEP
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Cloudflare Quick Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &
          sleep 5
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com" cloudflare.log | head -n 1)
          echo "--------------------------------------------------------"
          echo "🔗 LIVE LINK: $TUNNEL_URL/vnc.html"
          echo "--------------------------------------------------------"

      - name: Run Lightweight Android Container
        run: |
          # Uses a low-memory variant container with KVM enabled to survive the 7GB restriction
          docker run -d -p 6080:6080 --device /dev/kvm --privileged budtmo/docker-android-x86-9.0
          sleep 30
          sleep 21600
