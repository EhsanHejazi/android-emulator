name: Stream Headless Android Screen via ADB

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  stream-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cloudflare on Runner
        run: |
          curl -L --output cloudflared.deb https://github.com
          sudo dpkg -i cloudflared.deb

      - name: Run Headless Emulator & Stream ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # 1. Force the emulator to accept network connections over port 5555
            adb tcpip 5555
            sleep 2
            
            # 2. Spin up a Cloudflare quick tunnel routing raw TCP port 5555
            cloudflared tunnel --url tcp://localhost:5555 > cloudflare.log 2>&1 &
            sleep 5
            
            # 3. Output the raw TCP address connection string to your logs
            TCP_URL=$(grep -oE "tcp://[a-zA-Z0-9.-]+\.trycloudflare\.com:[0-9]+" cloudflare.log | head -n 1)
            echo "--------------------------------------------------------"
            echo "👉 YOUR TEMPORARY ADB SERVER STRIP DOWN:"
            echo "$TCP_URL"
            echo "--------------------------------------------------------"
            
            # Keep the tunnel alive for 6 hours
            sleep 21600
